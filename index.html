<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Photo Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#101010;
    --card:#1c1c1c;
    --cardHover:#262626;
    --text:#ffffff;
    --muted:#9a9a9a;
    --accent:#4ea3ff;
}

body{

    background:var(--bg);

    color:var(--text);

    font-family:Arial,Helvetica,sans-serif;

}

/* HEADER */

header{

    position:sticky;

    top:0;

    z-index:100;

    background:#181818;

    border-bottom:1px solid #333;

    padding:18px;

}

header h1{

    text-align:center;

    margin-bottom:15px;

}

#search{

    width:100%;

    padding:12px;

    border:none;

    outline:none;

    border-radius:10px;

    background:#242424;

    color:white;

    font-size:16px;

}

#stats{

    text-align:center;

    color:var(--muted);

    padding:16px;

}

/* MAIN GALLERY */

#gallery{

    display:grid;

    grid-template-columns:

        repeat(auto-fill,minmax(230px,1fr));

    gap:20px;

    padding:20px;

}

.card{

    background:var(--card);

    border-radius:14px;

    overflow:hidden;

    cursor:pointer;

    transition:.18s;

}

.card:hover{

    transform:translateY(-5px);

    background:var(--cardHover);

}

.card img{

    width:100%;

    aspect-ratio:3/4;

    object-fit:cover;

    display:block;

}

.cardInfo{

    padding:12px;

}

.cardTitle{

    font-size:15px;

    font-weight:bold;

    margin-bottom:8px;

}

.cardCount{

    color:var(--muted);

    font-size:14px;

}

/* PHOTOSET GRID */

#viewer{

    display:none;

    padding:20px;

}

#back{

    padding:12px 18px;

    border:none;

    border-radius:8px;

    background:#333;

    color:white;

    cursor:pointer;

    margin-bottom:18px;

}

#viewerTitle{

    margin-bottom:20px;

}

#imageGrid{

    display:grid;

    grid-template-columns:

        repeat(auto-fill,minmax(180px,1fr));

    gap:16px;

}

#imageGrid img{

    width:100%;

    border-radius:10px;

    cursor:pointer;

    display:block;

    transition:.2s;

}

#imageGrid img:hover{

    transform:scale(1.03);

}

/* FULLSCREEN */

#fullscreen{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.96);

    justify-content:center;

    align-items:center;

    z-index:999;

}

#fullscreen img{

    max-width:96vw;

    max-height:96vh;

    object-fit:contain;

}

#close{

    position:absolute;

    top:20px;

    right:20px;

    width:46px;

    height:46px;

    border:none;

    border-radius:50%;

    background:#333;

    color:white;

    font-size:22px;

    cursor:pointer;

}

#prev,#next{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    font-size:46px;

    padding:18px;

    cursor:pointer;

    user-select:none;

}

#prev{

    left:8px;

}

#next{

    right:8px;

}

#counter{

    position:absolute;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    color:#ddd;

    font-size:15px;

}

.loading{

    text-align:center;

    padding:60px;

    color:#aaa;

}

.error{

    text-align:center;

    color:#ff5555;

    padding:60px;

}

@media(max-width:650px){

    #gallery{

        grid-template-columns:

            repeat(auto-fill,minmax(160px,1fr));

    }

    #imageGrid{

        grid-template-columns:

            repeat(auto-fill,minmax(120px,1fr));

    }

}

</style>
</head>

<body>

<header>

<h1>📷 Photo Gallery</h1>

<input
id="search"
type="text"
placeholder="Search photosets...">

</header>

<div id="stats"></div>

<div id="gallery">

<div class="loading">

Loading gallery...

</div>

</div>

<div id="viewer">

<button id="back">

← Back

</button>

<h2 id="viewerTitle"></h2>

<div id="imageGrid"></div>

</div>

<div id="fullscreen">

<button id="close">

✕

</button>

<div id="prev">

❮

</div>

<img id="fullscreenImage">

<div id="next">

❯

</div>

<div id="counter"></div>

</div>

<script>

const JSON_FILE="gallery.json";

let gallery=[];

let filtered=[];

let currentSet=null;

let currentImage=0;

let startX=0;

const galleryDiv=document.getElementById("gallery");
const stats=document.getElementById("stats");
const search=document.getElementById("search");
const viewer=document.getElementById("viewer");
const imageGrid=document.getElementById("imageGrid");
const viewerTitle=document.getElementById("viewerTitle");

const fullscreen=document.getElementById("fullscreen");
const fullscreenImage=document.getElementById("fullscreenImage");
const counter=document.getElementById("counter");
    /* ===========================================
   LOAD JSON
=========================================== */

async function loadGallery(){

    try{

        const response=await fetch(JSON_FILE+"?"+Date.now());

        if(!response.ok){

            throw new Error("Unable to load gallery.json");

        }

        gallery=await response.json();

        filtered=[...gallery];

        renderGallery();

    }

    catch(err){

        galleryDiv.innerHTML=`

        <div class="error">

        Failed to load gallery.json

        <br><br>

        ${err.message}

        </div>

        `;

    }

}

/* ===========================================
   RENDER GALLERY
=========================================== */

function renderGallery(){

    galleryDiv.innerHTML="";

    stats.textContent=`${filtered.length} Photosets`;

    if(filtered.length===0){

        galleryDiv.innerHTML=`

        <div class="loading">

        No matching photosets.

        </div>

        `;

        return;

    }

    filtered.forEach(set=>{

        const card=document.createElement("div");

        card.className="card";

        const cover=

            set.thumbnail_urls &&

            set.thumbnail_urls.length

            ? set.thumbnail_urls[0]

            : "";

        card.innerHTML=`

            <img

                loading="lazy"

                src="${cover}"

                alt="${set.title}"

            >

            <div class="cardInfo">

                <div class="cardTitle">

                    ${set.title}

                </div>

                <div class="cardCount">

                    ${set.thumbnail_urls.length} Images

                </div>

            </div>

        `;

        card.onclick=()=>openPhotoset(set);

        galleryDiv.appendChild(card);

    });

}

/* ===========================================
   SEARCH
=========================================== */

search.addEventListener("input",()=>{

    const text=

        search.value

        .trim()

        .toLowerCase();

    filtered=

        gallery.filter(set=>

            set.title

            .toLowerCase()

            .includes(text)

        );

    renderGallery();

});

/* ===========================================
   OPEN PHOTOSET
=========================================== */

function openPhotoset(set){

    currentSet=set;

    galleryDiv.style.display="none";

    stats.style.display="none";

    viewer.style.display="block";

    viewerTitle.textContent=set.title;

    imageGrid.innerHTML="";

    set.thumbnail_urls.forEach((url,index)=>{

        const img=document.createElement("img");

        img.loading="lazy";

        img.src=url;

        img.onclick=()=>{

            currentImage=index;

            openFullscreen();

        };

        imageGrid.appendChild(img);

    });

}

/* ===========================================
   BACK BUTTON
=========================================== */

document

.getElementById("back")

.onclick=()=>{

    viewer.style.display="none";

    galleryDiv.style.display="grid";

    stats.style.display="block";

};

/* ===========================================
   FULLSCREEN
=========================================== */

function openFullscreen(){

    fullscreen.style.display="flex";

    showImage();

}

function closeFullscreen(){

    fullscreen.style.display="none";

}

document

.getElementById("close")

.onclick=closeFullscreen;
    /* ===========================================
   IMAGE VIEWER
=========================================== */

function showImage(){

    if(!currentSet) return;

    fullscreenImage.src=

        currentSet.thumbnail_urls[currentImage];

    counter.textContent=

        (currentImage+1)

        +" / "+

        currentSet.thumbnail_urls.length;

}

/* ===========================================
   NEXT / PREVIOUS
=========================================== */

function nextImage(){

    if(!currentSet) return;

    currentImage++;

    if(currentImage>=currentSet.thumbnail_urls.length){

        currentImage=0;

    }

    showImage();

}

function previousImage(){

    if(!currentSet) return;

    currentImage--;

    if(currentImage<0){

        currentImage=currentSet.thumbnail_urls.length-1;

    }

    showImage();

}

document

.getElementById("next")

.onclick=nextImage;

document

.getElementById("prev")

.onclick=previousImage;

/* ===========================================
   KEYBOARD CONTROLS
=========================================== */

document.addEventListener("keydown",e=>{

    if(fullscreen.style.display!=="flex")
        return;

    switch(e.key){

        case "ArrowRight":

            nextImage();

            break;

        case "ArrowLeft":

            previousImage();

            break;

        case "Escape":

            closeFullscreen();

            break;

        case "Home":

            currentImage=0;

            showImage();

            break;

        case "End":

            currentImage=

                currentSet.thumbnail_urls.length-1;

            showImage();

            break;

    }

});

/* ===========================================
   SWIPE SUPPORT
=========================================== */

fullscreen.addEventListener("touchstart",e=>{

    startX=e.changedTouches[0].clientX;

});

fullscreen.addEventListener("touchend",e=>{

    const endX=

        e.changedTouches[0].clientX;

    const diff=endX-startX;

    if(Math.abs(diff)<60) return;

    if(diff<0)

        nextImage();

    else

        previousImage();

});

/* ===========================================
   MOUSE WHEEL NAVIGATION
=========================================== */

fullscreen.addEventListener("wheel",e=>{

    e.preventDefault();

    if(e.deltaY>0)

        nextImage();

    else

        previousImage();

},{passive:false});

/* ===========================================
   DOUBLE CLICK = FULLSCREEN API
=========================================== */

fullscreenImage.ondblclick=()=>{

    if(!document.fullscreenElement){

        fullscreen.requestFullscreen();

    }

    else{

        document.exitFullscreen();

    }

};

/* ===========================================
   OPTIONAL SLIDESHOW
=========================================== */

let slideshow=null;

function toggleSlideshow(){

    if(slideshow){

        clearInterval(slideshow);

        slideshow=null;

        return;

    }

    slideshow=setInterval(()=>{

        nextImage();

    },2500);

}

document.addEventListener("keydown",e=>{

    if(fullscreen.style.display!=="flex")
        return;

    if(e.key===" "){

        e.preventDefault();

        toggleSlideshow();

    }

});

    /* ===========================================
   CLOSE WHEN CLICKING BACKGROUND
=========================================== */

fullscreen.addEventListener("click",e=>{

    if(e.target===fullscreen){

        closeFullscreen();

    }

});

/* ===========================================
   PRELOAD NEIGHBORING IMAGES
=========================================== */

function preloadNearbyImages(){

    if(!currentSet) return;

    const total=currentSet.thumbnail_urls.length;

    const next=(currentImage+1)%total;
    const prev=(currentImage-1+total)%total;

    const img1=new Image();
    img1.src=currentSet.thumbnail_urls[next];

    const img2=new Image();
    img2.src=currentSet.thumbnail_urls[prev];

}

const originalShowImage=showImage;

showImage=function(){

    originalShowImage();

    preloadNearbyImages();

};

/* ===========================================
   OPTIONAL: OPEN ORIGINAL PHOTOSET
=========================================== */

viewerTitle.style.cursor="pointer";

viewerTitle.title="Open original photoset";

viewerTitle.onclick=()=>{

    if(currentSet && currentSet.photoset_url){

        window.open(currentSet.photoset_url,"_blank");

    }

};

/* ===========================================
   UPDATE STATS
=========================================== */

function updateStats(){

    let imageCount=0;

    gallery.forEach(set=>{

        imageCount+=set.thumbnail_urls.length;

    });

    stats.textContent=

        gallery.length+

        " Photosets • "+

        imageCount+

        " Images";

}

/* Override renderGallery so stats stay updated */

const originalRenderGallery=renderGallery;

renderGallery=function(){

    originalRenderGallery();

    updateStats();

};

/* ===========================================
   START
=========================================== */

loadGallery();

</script>

</body>
</html>
